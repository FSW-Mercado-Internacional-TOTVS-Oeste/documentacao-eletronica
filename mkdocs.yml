site_name: TOTVS ADDONS
site_url: https://fsw-mi-totvsoeste.gitlab.io/documentacao-eletronica/
repo_url: https://gitlab.com/fsw-mi-totvsoeste/documentacao-eletronica

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-sunny
        name: Modo escuro
    - scheme: slate
      primary: indigo
      accent: orange
      toggle:
        icon: material/weather-night
        name: Modo claro
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit

nav:
  - Início: index.md
  - Addons:
      - CNAB a Receber: addon-cnab-a-receber.md
      - CNAB a Pagar: addon-cnab-a-pagar.md
      - CNAB Folha: addon-cnab-folha.md
      - CNAB Extrato Bancario: addon-cnab-extrato-bancario.md      

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - toc:      
      permalink: true      
      toc_depth: 3

extra_css:
  - stylesheets/extra.css