  - Suporte: suporte.md         

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:      
      permalink: false      
      toc_depth: 3

extra_javascript:
  - js/advpl_format.js  
  - js/extra.js

extra_css:
  - stylesheets/extra.css
  