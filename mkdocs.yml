site_name: TOTVS - Documentação Técnica
site_url: https://fsw-mi-addons.totvscascavel.com.br/
repo_url: https://gitlab.com/fsw-mi-totvsoeste/documentacao-eletronica

plugins:
  - search

theme:
  name: material
  language: pt
  logo: assets/totvs_icon_write.png
  favicon: assets/totvs_icon.png
  palette:
    - scheme: default
      primary: custom
      accent: orange

  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - navigation.tracking

nav:
  - Inicio: index.md  
  - Alçadas & Workflow:
    - A - Alçadas - Regras: addon-alcadas-regras.md
    - B - Alçadas - Workflow Pedido de Venda: addon-alcadas-pedido-venda.md
    - C - Alçadas - Workflow Pedidos de Compras: addon-alcadas-pedido-compras.md
    - D - Alçadas - Workflow Contas a Pagar: addon-alcadas-contas-pagar.md   

  - CNAB — Integração Bancária:
    - A - CNAB - A Receber: addon-cnab-a-receber.md
    - B - CNAB - A Pagar: addon-cnab-a-pagar.md
    - C - CNAB - Folha: addon-cnab-folha.md
    - D - CNAB - Extrato Bancario: addon-cnab-extrato-bancario.md 

  - XML:
    - A - Addon - Importação de XML: addon-xml-terceiro.md

  - Comissões & Faturamento:
    - A - Addon - Comissões e Faturamento: addon-comissoes-faturamento.md

  - Laticínios:  
    - A - Addon - Leite: addon-leite.md

  - Workflow Cadastrais:  
    - A - Addon - Processo de Workflow de Alçadas Cadastrais: addon-alcadas-workflow-cadastrais.md

  - Aceleradores:  
    - D - Addon - Acelerador: addon-acelerador-consultas-generica.md

  - Controle de Cheques:  
    - A - Addon - Controle de Cheques: controle-de-cheques.md

  - Mensagens DANFE:  
    - A - Addon - Mensagens DANFE: addon-mensagens-danfe.md

  - Separação / Expedição:  
    - A - Addon - Rotina de Expedição - Faturamento: addon-rotina-expedicao.md
    
  - Suporte: suporte.md         

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - toc:      
      permalink: false      
      toc_depth: 3

extra_javascript:
  - js/advpl_format.js  
  - js/extra.js

extra_css:
  - stylesheets/extra.css
  