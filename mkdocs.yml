site_name: TOTVS ADDONS
site_url: https://fsw-mi-totvsoeste.gitlab.io/documentacao-eletronica/
repo_url: https://gitlab.com/fsw-mi-totvsoeste/documentacao-eletronica

theme:
  name: material
  language: pt
  logo: assets/totvs_icon_write.png
  favicon: assets/totvs_icon.png
  palette:
    - scheme: default
      primary: custom
      accent: orange

  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - search.suggest
    - content.code.copy
    - content.action.edit
    - content.tabs.link

nav:
  - Início: index.md
  - Addons:
      - CNAB A Receber: addon-cnab-a-receber.md
      - CNAB A Pagar: addon-cnab-a-pagar.md
      - CNAB Folha: addon-cnab-folha.md
      - CNAB Extrato Bancario: addon-cnab-extrato-bancario.md   
  - Suporte: suporte.md         

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - toc:      
      permalink: true      
      toc_depth: 3

extra_css:
  - stylesheets/extra.css